name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
      tag: ${{ steps.publish-release.outputs.tag }}
    steps:
      - name: Create per-build release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 5
          retry-exempt-status-codes: 400,401,403,404,409,422
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const start = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${start.getUTCFullYear()}.${pad(start.getUTCMonth() + 1)}.${pad(start.getUTCDate())}-${pad(start.getUTCHours())}${pad(start.getUTCMinutes())}${pad(start.getUTCSeconds())}`;
            const releaseBody = [
              '## Toolkit nightly',
              '',
              'Built from the latest push to `main`.',
              '',
              '### Downloads',
              '',
              '- `toolkit-windows-msvc.exe` - Windows portable binary',
              '- `toolkit-linux.tar.gz` - Linux binary',
              '- `toolkit-macos.tar.gz` - macOS binary',
            ].join('\n');
            let tagName = `nightly-${stamp}`;
            let release;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: `Toolkit nightly ${stamp}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  target_commitish: context.sha,
                });
                release = response.data;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                tagName = `nightly-${stamp}-${attempt + 1}`;
              }
            }
            if (!release) throw new Error('could not create release');
            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', tagName);

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --package sonora
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Upload binary to release
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'cargo-target\release\sonora.exe'
          if (-not (Test-Path $exe)) { Write-Host "binary not found: $exe"; exit 1 }
          $zip = Join-Path $env:RUNNER_TEMP 'toolkit-windows-msvc.exe'
          Copy-Item -Path $exe -Destination $zip -Force
          gh release upload "${{ needs.create-release.outputs.tag }}" $zip --clobber
          Write-Host "uploaded windows binary"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --package sonora
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Upload binary to release
        run: |
          binary="${{ runner.temp }}/cargo-target/release/sonora"
          if [ ! -f "$binary" ]; then echo "binary not found: $binary"; exit 1; fi
          tar czf "${{ runner.temp }}/toolkit-linux.tar.gz" -C "${{ runner.temp }}/cargo-target/release" sonora
          gh release upload "${{ needs.create-release.outputs.tag }}" "${{ runner.temp }}/toolkit-linux.tar.gz" --clobber
          echo "uploaded linux binary"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --package sonora
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Upload binary to release
        run: |
          binary="${{ runner.temp }}/cargo-target/release/sonora"
          if [ ! -f "$binary" ]; then echo "binary not found: $binary"; exit 1; fi
          tar czf "${{ runner.temp }}/toolkit-macos.tar.gz" -C "${{ runner.temp }}/cargo-target/release" sonora
          gh release upload "${{ needs.create-release.outputs.tag }}" "${{ runner.temp }}/toolkit-macos.tar.gz" --clobber
          echo "uploaded macos binary"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}