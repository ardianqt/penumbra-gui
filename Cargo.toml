[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.37.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
penumbra-mtk = { path = "crates/penumbra-core" }
penumbra-macros = { path = "crates/penumbra-macros" }
embed = { path = "crates/embed" }
i18n = { path = "crates/i18n" }
icons = { path = "crates/icons" }
state = { path = "crates/state" }
input = { path = "crates/input" }
router = { path = "crates/router" }
ui = { path = "crates/ui" }
views = { path = "crates/views" }

hacc = { git = "https://github.com/shomykohai/hacc", version = "0.1.0", features = ["alloc", "crc32"] }
acon = { git = "https://github.com/shomykohai/acon", version = "0.1.0" }

anyhow = "1.0"
dirs = "6.0"
env_logger = "0.11"
fastrand = "2.5"
futures = "0.3"
fluent-bundle = "0.16"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "770544dfcf70fdcf0b5c6e28edb58e2fa77a7e67" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "770544dfcf70fdcf0b5c6e28edb58e2fa77a7e67", features = [
  "font-kit",
  "wayland",
  "x11",
] }
winresource = "0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sys-locale = "0.3"
unic-langid = { version = "0.9", features = ["macros"] }
unicode-segmentation = "1.12"
tokio = { version = "1.53", features = [
  "rt-multi-thread", "net", "io-util", "macros", "sync", "time",
] }
sha2 = "0.10"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSAccessibility", "NSApplication", "NSMenu", "NSMenuItem",
  "NSResponder", "NSRunningApplication", "NSStatusItem", "NSWorkspace",
] }
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
unicode-segmentation = "1.12"
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2